[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicione"
version = "0.1.0"
description = "Analytical reasoning and symbolic solving engine for analog electronic circuits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "ceml-lang>=0.1.0",
    "sympy>=1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["aicione*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
